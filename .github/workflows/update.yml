name: Daily NAV
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nav-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update.py
      - run: |
          git config user.name 'nav-bot'
          git config user.email 'nav-bot@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || (git commit -m 'Update public NAV' && git push)
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p _site/data
          cp index.html manifest.json sw.js _site/
          cp data/products.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
