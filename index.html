<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#7160ad"><link rel="manifest" href="manifest.json"><title>中行理财助手</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5fa;color:#263047;font:14px system-ui,sans-serif}header{background:#7160ad;color:white;padding:16px}h1{font-size:20px;margin:0 0 5px}main{padding:10px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}input,select,button{font:inherit;padding:8px;border:1px solid #d7d5e2;border-radius:7px;background:white;color:inherit}input[type=search]{flex:1;min-width:130px}.scroll{overflow:auto;max-height:66vh;background:white;border:1px solid #ddd}table{border-collapse:separate;border-spacing:0;white-space:nowrap;font-variant-numeric:tabular-nums}td,th{padding:11px 9px;border-bottom:1px solid #e6e6ee;text-align:right}th{position:sticky;top:0;background:#7866b3;color:white;z-index:2;cursor:pointer}td:first-child,th:first-child{position:sticky;left:0;min-width:145px;max-width:145px;text-align:left;white-space:normal;box-shadow:2px 0 4px #0001}th:first-child{z-index:3}td:first-child{background:inherit}tr:nth-child(even){background:#f6f7fb}tr:nth-child(odd){background:white}small{display:block;color:#8590a3}.pos{color:#c52b30}.neg{color:#16804a}.note{font-size:12px;color:#657087;line-height:1.6}a{color:#7160ad}.star{border:0;padding:0 3px;background:none;color:#a68b35}</style><header><h1>中行理财助手</h1><div id="stamp">读取中…</div></header><main><div class="controls"><input type="search" id="q" placeholder="搜索名称或代码"><button id="refresh">刷新</button><select id="risk"><option value="all">全部公开净值（风险待核实）</option><option value="R2">已核实R2人民币</option></select><select id="term"><option value="">持有期不限</option><option value="0">每日开放</option><option value="7">≤7天</option><option value="30">≤30天</option></select><select id="sale"><option value="">全部销售状态</option><option>公开在售</option><option>待售</option><option>暂停申购</option><option>未知</option></select><label><input id="fav" type="checkbox">仅自选</label><button id="export">导出CSV</button></div><div id="summary" class="note"></div><div class="scroll"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div><p class="note">点击表头排序，左右滑动查看。最新净值超过30个自然日未更新的产品不展示；无净值日期的产品暂保留。跨日万收按日均折算；回撤仅覆盖已采集历史。公告万收估算=官方日净值增长率×100，覆盖区间未核实，可能跨日；名称提示不是合同条款。公开在售不代表App有额度。净值收益可能未扣超额报酬。风险、币种、销售状态未核实则留空。</p><p><a href="https://e.boc.cn/ezcms/if/ifwb.html">官方销售查询</a> · <a href="https://www.boc.cn/sourcedb/srfd6_2024/index.html">官方净值</a></p></main><script>
const $=id=>document.getElementById(id),cols=[['name','产品名称'],['date','净值日期'],['daily','当日万收/日均'],['gap','间隔天数'],['publishedDaily','公告万收估算'],['avg7','7日均万收'],['avg30','30日均万收'],['avg90','90日均万收'],['annual30','近1月年化%'],['annual90','近3月年化%'],['annual180','近6月年化%'],['annual365','近1年年化%'],['dd','已采集最大回撤%'],['historyDays','历史覆盖天数'],['days','已核实持有天数'],['termHint','名称提示持有天数'],['audienceHint','名称提示'],['status','销售状态'],['nav','单位净值'],['risk','风险'],['currency','币种'],['issuer','机构'],['code','代码']];let staleExcluded=0,data=[],key='publishedDaily',desc=true,visible=[],favorites=new Set(JSON.parse(localStorage.getItem('favorites')||'[]'));function el(t,s){let e=document.createElement(t);if(s!==undefined)e.textContent=s;return e}function draw(){visible=data.filter(p=>($('risk').value==='all'||(p.risk==='R2'&&p.currency==='CNY'))&&(!$('q').value||(p.name+p.code).toLowerCase().includes($('q').value.toLowerCase()))&&(!$('term').value||(p.days!=null&&p.days<=+$('term').value))&&(!$('sale').value||(p.status||'未知')===$('sale').value)&&(!$('fav').checked||favorites.has(p.code))).sort((a,b)=>a[key]==null?(b[key]==null?0:1):b[key]==null?-1:(typeof a[key]==='number'?a[key]-b[key]:String(a[key]).localeCompare(String(b[key]),'zh'))*(desc?-1:1));$('head').replaceChildren();for(const [k,label] of cols){let th=el('th',label+(k===key?(desc?' ↓':' ↑'):' ↕'));th.onclick=()=>{desc=key===k?!desc:!['days','dd','name'].includes(k);key=k;draw()};$('head').append(th)}$('body').replaceChildren();for(const p of visible){let tr=el('tr');for(const [k] of cols){let v=p[k],td=el('td');if(k==='name'){let b=el('button',favorites.has(p.code)?'★':'☆');b.className='star';b.onclick=()=>{favorites.has(p.code)?favorites.delete(p.code):favorites.add(p.code);localStorage.setItem('favorites',JSON.stringify([...favorites]));draw()};td.append(b,document.createTextNode(p.name),el('small',p.code))}else{td.textContent=v==null?(k==='status'?'未知':'—'):typeof v==='number'?v.toFixed(k==='nav'?6:['days','gap','historyDays'].includes(k)?0:2):v;if(/daily|avg|annual/i.test(k)&&typeof v==='number')td.className=v<0?'neg':v>0?'pos':''}tr.append(td)}$('body').append(tr)}$('summary').textContent='显示 '+visible.length+' / '+data.length+' 款 · 已剔除过期净值 '+staleExcluded+' 款 · 已核实R2人民币 '+data.filter(p=>p.risk==='R2'&&p.currency==='CNY').length+' 款'}async function load(){try{let r=await fetch('data/products.json?t='+Date.now());if(!r.ok)throw Error(r.status);let j=await r.json();staleExcluded=j.staleExcluded??0;data=j.products;$('stamp').textContent=(j.updated?'最近采集：'+new Date(j.updated).toLocaleString():'初始历史快照，尚未自动采集')+(j.errors?.length?' · 部分页面失败':'');draw()}catch(e){$('stamp').textContent='读取失败：'+e.message}}for(const id of ['q','risk','term','sale','fav'])$(id).oninput=draw;$('refresh').onclick=load;$('export').onclick=()=>{let esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';let csv='\ufeff'+[cols.map(c=>esc(c[1])).join(','),...visible.map(p=>cols.map(c=>esc(p[c[0]])).join(','))].join('\n');let a=el('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='boc-radar.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
